spring:
  application:
    name: vkm-backend


  datasource:
    url: jdbc:postgresql://localhost:5432/kvmdb
    username: ${KEY_POSTGRES_USER}
    password: ${KEY_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}
      expiration-minutes: 15
    refresh-token:
      expiration-days: 14

