spring:
  application:
    name: vkm-backend
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration-minutes: 15
    refresh-token:
      expiration-days: 14

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html