spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kvmdb}
    username: ${KEY_POSTGRES_USER}
    password: ${KEY_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true

api:
  security:
    token:
      secret: ${JWT_SECRET:local-dev-secret-change-me}
