services:
  api:
    build: .
    image: vkm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${KEY_POSTGRES_DB}
      KEY_POSTGRES_DB: ${KEY_POSTGRES_DB}
      KEY_POSTGRES_USER: ${KEY_POSTGRES_USER}
      KEY_POSTGRES_PASSWORD: ${KEY_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:latest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${KEY_POSTGRES_DB}
      POSTGRES_USER: ${KEY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEY_POSTGRES_PASSWORD}
    ports:
      - "${KEY_POSTGRES_PORT}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} "]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
    postgres-data: